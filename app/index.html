<style>
:root{--bg:#0b0907;--card:#1a140f;--chip:#2a1f16;--am:#ffae42;--fg:#f6ece0;--mu:#a8957f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2411,var(--bg) 60%) fixed;color:var(--fg);font:15px/1.4 system-ui,sans-serif;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{background:none;color:inherit;border:0;font:inherit;cursor:pointer;padding:0}
[hidden]{display:none!important}
header{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 14px 4px}
h1{flex:1;margin:0;font:700 22px Georgia,'Palatino Linotype',serif;letter-spacing:4px;color:var(--am);text-shadow:0 0 14px #ff8a0066}
.ic{width:42px;height:42px;font-size:22px;border-radius:50%}
nav,#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
nav button,#chips button,.btn{flex:none;background:var(--chip);border-radius:20px;padding:9px 16px;font-weight:600;color:var(--mu)}
nav button.on,#chips button.on,.btn.pri{background:var(--am);color:#1a1005}
main{padding:4px 14px;max-width:820px;margin:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px;margin:8px 0;background:var(--card);border-radius:16px;cursor:pointer}
.row .th{width:54px;height:54px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:26px;flex:none}
.row .tx{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small,small{color:var(--mu)}.row.cur b{color:var(--am)}
.bar{height:4px;background:var(--chip);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--am)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;background:#2b1b10;border:1px solid #ffae4244;border-radius:20px;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;box-shadow:0 6px 30px #000a}
#mini .tx{flex:1;min-width:0}#mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{width:46px;height:46px;border-radius:50%;background:var(--am);color:#1a1005;font-size:20px;flex:none}
.pg{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.art{width:min(70vw,38vh);aspect-ratio:1;margin:10px auto;border-radius:22px;background:linear-gradient(135deg,#4a2a12,#1a0f07);display:grid;place-items:center;font-size:80px;box-shadow:0 0 40px #ff8a0033}
#nT{font:700 24px Georgia,serif;color:var(--am);margin:8px 0 2px;overflow-wrap:anywhere}
input[type=range]{width:100%;accent-color:var(--am)}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-variant-numeric:tabular-nums}
.big{font:700 34px ui-monospace,monospace;text-align:center;color:var(--fg);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-around;align-items:center;margin:14px 0}.ctl button{font-size:26px;width:60px;height:60px}
.ctl .pp{width:76px;height:76px;font-size:32px}
.bot{display:flex;justify-content:space-around;margin-top:auto;gap:6px}
#sb{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end;justify-content:center}
#sh{width:100%;max-width:560px;max-height:80vh;overflow:auto;background:#22170e;border-radius:24px 24px 0 0;padding:12px 10px calc(14px + env(safe-area-inset-bottom))}
#sh h3{margin:6px 10px 8px;color:var(--am)}#sh .it{display:flex;width:100%;text-align:left;padding:13px 10px;border-radius:12px;gap:10px}
#sh .it:active{background:#ffffff14}#sh .it.on{color:var(--am)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;background:#000d;padding:10px 18px;border-radius:20px;max-width:90vw;text-align:center}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}.tbar input[type=text],.tbar input[type=number]{background:var(--chip);color:inherit;border:0;border-radius:16px;padding:8px 12px;font:inherit;width:90px}
#bk{position:relative;display:inline-flex;perspective:2400px;vertical-align:top}
#cv,#cvR{display:block;flex:none;max-width:none;background:#fff;box-shadow:0 4px 24px #000a}
#bk.sp #cv{border-radius:4px 0 0 4px}#bk.sp #cvR{border-radius:0 4px 4px 0}
#bk.sp:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;margin-left:-18px;background:linear-gradient(90deg,#0000,#0007 50%,#0000);pointer-events:none;z-index:2}
.leaf{position:absolute;z-index:5;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.25,1);box-shadow:0 0 40px #000b}
.leaf canvas{position:absolute;inset:0;width:100%!important;height:100%!important;backface-visibility:hidden;-webkit-backface-visibility:hidden;visibility:visible!important}
.leaf .bs{transform:rotateY(180deg)}#cvw{flex:1;overflow:auto;text-align:center;touch-action:pan-x pan-y pinch-zoom}
.night canvas{filter:invert(1) hue-rotate(180deg)}

<script>
const $=s=>document.querySelector(s),aud=$('#aud');
const fmt=t=>{t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+s.length.toString(36)};
/* ---- storage: localStorage + IndexedDB mirror, files kept as blobs in IndexedDB ---- */
const DB=new Promise(r=>{const q=indexedDB.open('brazils-cave',1);q.onupgradeneeded=()=>{q.result.createObjectStore('f');q.result.createObjectStore('m')};q.onsuccess=()=>r(q.result)});
const io=(m,s,k,v)=>DB.then(d=>new Promise((res,rej)=>{const t=d.transaction(s,m),o=t.objectStore(s),q=v!==undefined?o.put(v,k):m=='readonly'?o.get(k):o.delete(k);t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}));
const get=(s,k)=>io('readonly',s,k),put=(s,k,v)=>io('readwrite',s,k,v),del=(s,k)=>io('readwrite',s,k);
let S={books:{},hist:[],marks:[],genres:['Anime','Fantasy','Dark Fantasy','Sci-Fi','Comics'],pdfs:{},rate:1,rew:0,u:0};
try{Object.assign(S,JSON.parse(localStorage.cave||'{}'))}catch(e){}
let lastMirror=0;
function persist(force){S.u=Date.now();try{localStorage.cave=JSON.stringify(S)}catch(e){}if(force||Date.now()-lastMirror>8000){lastMirror=Date.now();put('m','S',S).catch(()=>{})}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function sheet(title,items){const sh=$('#sh');sh.innerHTML='<h3>'+esc(title)+'</h3>';items.forEach(([l,f,on])=>{const b=document.createElement('button');b.className='it'+(on?' on':'');b.textContent=l;b.onclick=()=>{if(f)f();if(!on||f)closeSheet()};sh.append(b)});$('#sb').hidden=false}
const closeSheet=()=>$('#sb').hidden=true;$('#sb').onclick=e=>{if(e.target.id=='sb')closeSheet()};
/* ---- library ---- */
let tab='lib',gen=null,cur=null,ready=false,url=null,sess=null,lastSave=0;
const bookTotal=b=>b.tracks.reduce((a,t)=>a+(t.d||0),0);
const elapsed=b=>b.tracks.slice(0,b.pos.i).reduce((a,t)=>a+(t.d||0),0)+b.pos.t;
function prog(b){const T=bookTotal(b),known=b.tracks.every(t=>t.d);return known&&T?elapsed(b)/T:(b.pos.i+(b.pos.t>0?.5:0))/b.tracks.length}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const ch=$('#chips'),m=$('#main');ch.hidden=tab!='lib';
 if(tab=='lib'){
  const g=['All',...S.genres,'Unsorted'];
  ch.innerHTML=g.map(x=>`<button data-g="${esc(x)}" class="${(gen||'All')==x?'on':''}">${esc(x)}</button>`).join('')+'<button data-g="+">＋ Genre</button>';
  ch.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.g;if(v=='+'){const n=(prompt('New genre / shelf name')||'').trim();if(n&&!S.genres.includes(n)){S.genres.push(n);persist(1)}}else gen=v=='All'?null:v;render()});
  const L=Object.values(S.books).filter(b=>!gen||(gen=='Unsorted'?!b.genres.length:b.genres.includes(gen))).sort((a,b)=>(b.u||0)-(a.u||0));
  m.innerHTML='<div class="tbar"><button class="btn pri" id="addB">'+TV().ad+'</button>'+HINT()+'</div>'+(L.length?L.map(b=>`<div class="row ${cur&&cur.id==b.id?'cur':''}" data-id="${b.id}"><span class="th">${b.gone?'💤':TV().bk}</span><span class="tx"><b>${esc(b.title)}</b><small>${esc(b.genres.join(' · ')||'Unsorted')}<br>${b.gone?'⚠ file missing — re-add the same file to resume at ':'⏱ '}${fmt(b.pos.t)}${b.tracks.length>1?' · part '+(b.pos.i+1)+'/'+b.tracks.length:''}${b.done?' · ✔ finished':''}</small><div class="bar"><i style="width:${Math.min(100,prog(b)*100)}%"></i></div></span><button class="ic" data-m="${b.id}">⋮</button></div>`).join(''):'<div class="empty">The cave is empty.<br><small>Add audiobooks (mp3, m4b, m4a…). Every second you listen is remembered.</small></div>');
  $('#addB').onclick=()=>$('#fa').click();
  m.querySelectorAll('.row').forEach(r=>r.onclick=e=>{const mm=e.target.closest('[data-m]');if(mm)bookMenu(mm.dataset.m);else openBook(r.dataset.id)});
 }else if(tab=='pdf'){
  const L=Object.entries(S.pdfs).sort((a,b)=>(b[1].u||0)-(a[1].u||0));
  m.innerHTML='<div class="tbar"><button class="btn pri" id="addP">'+TV().pd+'</button>'+HINT()+'</div>'+(L.length?L.map(([id,p])=>`<div class="row" data-id="${id}"><span class="th">📄</span><span class="tx"><b>${esc(p.n)}</b><small>Page ${p.page||1}${p.pages?' / '+p.pages:''}</small></span><button class="ic" data-x="${id}">🗑</button></div>`).join(''):'<div class="empty">Open any PDF — comics, art books, manuals.<br><small>It remembers your page.</small></div>');
  $('#addP').onclick=()=>$('#fp').click();
  m.querySelectorAll('.row').forEach(r=>r.onclick=async e=>{const x=e.target.closest('[data-x]');if(x){if(confirm('Remove this PDF?')){delete S.pdfs[x.dataset.x];del('f','pdf:'+x.dataset.x);persist(1);render()}}else openPdf(r.dataset.id)});
 }else{

$('#fT').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;toast('Loading thunder…');for(let i=0;i<(S.thN||0);i++)await del('f','snd-th:'+i);for(let i=0;i<fs.length;i++)await put('f','snd-th:'+i,fs[i]);S.thN=fs.length;S.theme.real=1;persist(1);await loadReal();ctlSync();toast(fs.length+' thunder sound(s) ready')};
$('#sClr').onclick=async()=>{await del('f','snd-rain');for(let i=0;i<(S.thN||0);i++)await del('f','snd-th:'+i);S.rainName=null;S.thN=0;S.theme.real=0;persist(1);await loadReal();ctlSync();toast('Back to built-in sound')};
$('#kRl').onchange=e=>sv('real',e.target.checked?1:0);$('#rTv').oninput=e=>sv('tv',+e.target.value);
/* ---- PC: Ctrl+V paste & drag-and-drop of files anywhere in the app ---- */
const HINT=()=>matchMedia('(pointer:fine)').matches?'<small>Ctrl+V to paste files · or drop them anywhere</small>':'';
const kind=f=>{const n=f.name.toLowerCase(),t=f.type||'';return t=='application/pdf'||/\.pdf$/.test(n)?'pdf':/^audio\//.test(t)||/\.(mp3|m4b|m4a|ogg|opus|flac|wav|aac)$/.test(n)?'aud':/^image\//.test(t)||/\.(gif|webp|avif|png|jpe?g)$/.test(n)?'img':/^video\//.test(t)||/\.(mp4|webm|mkv)$/.test(n)?'vid':/\.json$/.test(n)?'json':''};
function intake(files){files=[...files];const g={};files.forEach(f=>(g[kind(f)]=g[kind(f)]||[]).push(f));let done=0;const fake=a=>({target:{files:a,value:''}});
 if(g.pdf){$('#fp').onchange(fake(g.pdf));done=1}
 if(g.aud){$('#fa').onchange(fake(g.aud));done=1}
 const w=(g.img||[]).concat(g.vid||[]);if(w.length&&(!$('#thm').hidden||confirm('Use “'+w[0].name+'” as your wallpaper?'))){$('#fw').onchange(fake([w[0]]));done=1}
 if(g.json&&confirm('Import “'+g.json[0].name+'” as a memory backup?')){$('#fj').onchange(fake([g.json[0]]));done=1}
 return done}
addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;let fs=[...cd.files];if(!fs.length)fs=[...cd.items].filter(i=>i.kind=='file').map(i=>i.getAsFile()).filter(Boolean);
 if(!fs.length){const t=e.target;if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName))return;return toast('No files on the clipboard — copy audio, PDF or image files first')}
 e.preventDefault();intake(fs)||toast('That file type isn’t supported')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files;if(f&&f.length)intake(f)||toast('That file type isn’t supported')});
/* ---- boot: restore newest memory & the exact last spot ---- */
(async()=>{try{const m=await get('m','S');if(m&&(m.u||0)>(S.u||0)){S=Object.assign(S,m);persist(1)}}catch(e){}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 S.theme=S.theme||defTheme();{const T=S.theme;T.sk=T.sk||(PRE[T.pre]?T.pre:'cave');T.nm=T.nm||PRE[T.sk].nm;if(T.lg===undefined)T.lg=PRE[T.sk].lg;if(T.tv===undefined)T.tv=.8}applyTheme(1);wall();fxLoop();
 render();if(S.last&&S.books[S.last]&&!S.books[S.last].gone){const b=S.books[S.last];load(S.last,b.pos.i,b.pos.t,false)}})();
</script></body></html>
